# ===================================================
# DEV PROFILE — H2 In-Memory Database
# ===================================================
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# No MySQL installation required.

# ===================================================
# DATASOURCE (H2 In-Memory)
# ===================================================
spring.datasource.url=jdbc:h2:mem:doctor_app;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===================================================
# JPA / HIBERNATE
# ===================================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ===================================================
# H2 CONSOLE (access at http://localhost:8080/h2-console)
# ===================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================================
# SEED DATA (always enabled for dev profile)
# ===================================================
app.seed-data=true

# ===================================================
# EMAIL (disabled in dev — no SMTP needed)
# ===================================================
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=
