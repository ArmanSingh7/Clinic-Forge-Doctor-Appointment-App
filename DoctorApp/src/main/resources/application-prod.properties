# ===================================================
# PROD PROFILE — every value comes from an environment variable.
# Activate with SPRING_PROFILES_ACTIVE=prod (set in Render). No secrets live in this file.
# ===================================================

server.port=${PORT:8080}

# ---------- Database (MySQL, e.g. Aiven free tier) ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Free database plans have tight connection limits.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Security ----------
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Comma-separated front-end origins allowed to call this API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ---------- App ----------
app.reset-password-url=${FRONTEND_URL:http://localhost:3000}/reset-password
# Seeds demo users/doctors once, only when the database is empty.
app.seed-data=${SEED_DATA:true}
file.upload-dir=${UPLOAD_DIR:./uploads/documents}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------- Email (optional) ----------
# Leave MAIL_USERNAME empty to disable sending: emails are then written to the log
# instead. Note: Render's free tier blocks SMTP ports, so email needs a paid instance.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Swagger stays reachable at /swagger-ui.html for reviewers.
springdoc.swagger-ui.path=/swagger-ui.html
